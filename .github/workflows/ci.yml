name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Dummy values for CI only. None of these are real secrets.
    env:
      FLASK_APP: app
      FLASK_CONFIG: development
      SECRET_KEY: ci-dummy-secret-key-not-used-anywhere-else
      BASE_URL: http://localhost:8002
      DATABASE_URL: postgresql+psycopg://ci:ci-password@localhost:5432/ci
      # The tests create this database on the same server
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci-password@localhost:5432/ci_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Migrations apply
        run: flask db upgrade

      - name: Migrations match the models
        run: flask db check

      - name: Tests
        run: pytest
